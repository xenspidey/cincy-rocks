name: Publish website

# Publishes the website to GitHub Pages on every push to main.
# Repository variables (Settings > Secrets and variables > Actions > Variables):
#   CUSTOM_DOMAIN      your domain, e.g. cincyrocks.com (leave unset to use <account>.github.io/<repo>)
#   SUPABASE_URL       your Supabase project URL      } leave both unset for demo mode
#   SUPABASE_ANON_KEY  your Supabase "anon" public key }
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          REPO_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            export VITE_BASE=/ VITE_SITE_URL="https://$CUSTOM_DOMAIN"
          else
            export VITE_BASE="/$REPO_NAME/" VITE_SITE_URL="https://$OWNER.github.io/$REPO_NAME"
          fi
          npm run build
          touch dist/.nojekyll
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > dist/CNAME; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
