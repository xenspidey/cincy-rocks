name: Build phone apps

# Builds the Android app (an installable .apk) on Linux and the iPhone app on macOS
# every time code is pushed. Download the results under the run's "Artifacts".
on:
  push:
  pull_request:
  workflow_dispatch:

# The phone apps use the same live database and website address as the website
# (repository variables, see pages.yml). Unset means demo mode. Without CUSTOM_DOMAIN,
# invite QR codes point at the GitHub Pages address, as the website does.
env:
  VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
  VITE_SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Same version name as the website's live-update copy of this commit (see pages.yml),
      # so a fresh install doesn't download what it already has.
      - run: VITE_APP_BUILD="$(node -p "require('./package.json').version")-${GITHUB_SHA::7}" npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same version name as the website's live-update copy of this commit (see pages.yml),
      # so a fresh install doesn't download what it already has.
      - run: VITE_APP_BUILD="$(node -p "require('./package.json').version")-${GITHUB_SHA::7}" npm run build
      - run: npx cap sync ios
      # Simulator build: needs no Apple account. For a real iPhone or the App Store,
      # open ios/App/App.xcodeproj in Xcode, pick your team under Signing, then Archive.
      - run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - run: cd ios/build/Build/Products/Debug-iphonesimulator && zip -qr ../../../../App-simulator.zip App.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios/App-simulator.zip

  # Installable iPhone app (.ipa), signed with your Apple Developer account.
  # Turned on by the repository variable IOS_SIGNING = true and the secrets described in
  # README.md ("iPhone app on GitHub"). Uploads to TestFlight when the App Store Connect
  # API key secrets are also set.
  ios-signed:
    if: ${{ vars.IOS_SIGNING == 'true' }}
    runs-on: macos-latest
    env:
      EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD || 'app-store-connect' }}
      BUNDLE_ID: com.cincyrocks.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Same version name as the website's live-update copy of this commit (see pages.yml),
      # so a fresh install doesn't download what it already has.
      - run: VITE_APP_BUILD="$(node -p "require('./package.json').version")-${GITHUB_SHA::7}" npm run build
      - run: npx cap sync ios
      - name: Install signing certificate and profile
        env:
          CERT_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          NAME=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract Name raw -)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/app.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
      - name: Archive and export the .ipa
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>$EXPORT_METHOD</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>$BUNDLE_ID</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath ios/export
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/export/*.ipa
      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        if: ${{ env.EXPORT_METHOD == 'app-store-connect' }}
        run: |
          if [ -z "$API_KEY_ID" ]; then echo "No App Store Connect API key set; skipping the TestFlight upload."; exit 0; fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          xcrun altool --upload-app -t ios -f ios/export/*.ipa --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
